<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap">
<style>
@keyframes ratingShine { 0%,30% { left:-30%; } 70%,100% { left:130%; } }
@media (prefers-reduced-motion: reduce) { .pc-anim { animation:none !important; } }
</style>
</helmet>
<div style="perspective:1000px;width:280px;border-radius:17px;box-shadow:0 24px 48px -18px rgba(0,0,0,.8);font-family:Outfit,ui-sans-serif,sans-serif">
  <div ref="{{ cardRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="width:280px;position:relative;border-radius:17px;background:linear-gradient(160deg,#17151b 0%,#0c0b0e 55%,#14100a 100%);border:1px solid #262626;clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%);overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d;cursor:pointer">
    <div style="position:absolute;inset:0;pointer-events:none;z-index:0;mix-blend-mode:color-dodge;opacity:.16;background:repeating-linear-gradient(72deg,transparent 0 6px,{{ k.accent }} 6px 8px,transparent 8px 16px,#fff 16px 17px,transparent 17px 26px)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.5;z-index:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.32),transparent 42%),linear-gradient(115deg,transparent 15%,{{ k.a }} 32%,{{ k.b }} 50%,transparent 72%)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:0;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;padding:1px;background:linear-gradient(150deg,{{ k.line }} 0%,transparent 30%,transparent 70%,{{ k.line }} 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85"></div>
    <div style="position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,.08)">
      <span style="font-family:Rajdhani,sans-serif;font-size:13px;font-weight:700;color:{{ k.rankColor }}">{{ rankLabel }}</span>
      <span style="position:relative;overflow:hidden;font-family:Rajdhani,sans-serif;font-weight:700;font-size:16px;color:#14110a;background:linear-gradient(100deg,#ffe9b0,{{ k.accent }} 55%,#ffe9b0 100%);padding:2px 9px;border-radius:3px;transform:skewX(-8deg);box-shadow:0 0 10px {{ k.a }},0 1px 0 rgba(255,255,255,.5) inset">{{ p.rating }}<span class="pc-anim" style="position:absolute;top:-60%;left:-20%;width:40%;height:220%;background:rgba(255,255,255,.55);transform:rotate(20deg);animation:ratingShine 4.5s ease-in-out infinite"></span></span>
    </div>
    <div style="position:relative;z-index:1;height:236px;overflow:hidden">
      <div style="position:absolute;z-index:0;left:50%;bottom:4%;width:70%;height:40%;transform:translateX(-50%);background:radial-gradient(ellipse at center,{{ k.a }} 0%,transparent 72%);pointer-events:none;filter:blur(2px)"></div>
      <span style="position:absolute;z-index:2;top:8px;left:10px;font-size:9px;color:#8a8a8a">{{ phaseLabel }}</span>
      <div style="position:absolute;inset:0;background:linear-gradient(160deg,#201c14,#0c0b0e);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:{{ k.ini }};letter-spacing:.06em">{{ initials }}</div>
      <div style="position:absolute;z-index:2;left:0;right:0;bottom:0;height:46px;background:linear-gradient(to top,#14100a 0%,transparent 100%);pointer-events:none;opacity:.8"></div>
      <span title="{{ p.credit }}" style="position:absolute;z-index:3;right:6px;bottom:4px;max-width:78%;font-size:7.5px;line-height:1.2;color:rgba(255,255,255,.42);text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.credit }}</span>
    </div>
    <div style="position:relative;z-index:3;margin:0 14px;padding:8px 10px;text-align:center;background:rgba(0,0,0,.68);border-top:1px solid {{ k.line }};border-bottom:1px solid {{ k.line }};transform:rotate(-.6deg)">
      <h3 style="font-family:Rajdhani,sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;margin:0;height:22px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e5e5e5">{{ p.name }}</h3>
      <div style="margin-top:2px;height:14px;line-height:14px;font-size:10px;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8f8f8f;font-weight:700">{{ p.team }} · {{ p.pos }} · 2025-2026</div>
      <div style="margin-top:1px;height:14px;line-height:14px;font-size:10px;letter-spacing:.07em;color:{{ k.accent }};font-weight:700">{{ p.arch }}</div>
    </div>
    <div style="position:relative;z-index:3;margin:9px 12px 0;padding:9px 10px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.06);border-radius:11px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center">
        <sc-for list="{{ quick }}" as="q" hint-placeholder-count="3"><div style="border-left:1px solid {{ q.sep }}"><div style="font-family:Rajdhani,sans-serif;font-weight:700;font-size:14px;color:{{ q.c }}">{{ q.v }}</div><div style="font-size:7.5px;color:#7a7a7a;letter-spacing:.09em;margin-top:1px">{{ q.l }}</div></div></sc-for>
      </div>
    </div>
    <div onClick="{{ onToggle }}" style="position:relative;z-index:3;margin:10px 12px 0;padding:7px 10px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.06);border-radius:{{ peekRadius }};display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:{{ k.accent }};font-family:Rajdhani,sans-serif;font-weight:700">
      <span>Full Profile</span><span style="font-size:8px;display:inline-block;transform:rotate({{ chevDeg }})">▾</span>
    </div>
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
      <div style="position:relative;z-index:3;margin:0 12px 12px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.06);border-top:none;border-radius:0 0 11px 11px">
        <div style="display:flex;border-bottom:1px solid rgba(255,255,255,.08)">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="flex:1;background:none;border:none;border-bottom:2px solid {{ t.border }};padding:7px 1px;font-family:Rajdhani,sans-serif;font-size:9px;font-weight:700;color:{{ t.color }}">{{ t.label }}</button></sc-for>
        </div>
        <div style="padding:11px;min-height:150px">
          <div style="font-family:Rajdhani,sans-serif;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f6f6f;margin:0 0 6px">Archetype fit — vs the {{ p.league }} {{ phaseLower }} pool</div>
          <sc-for list="{{ fits }}" as="a"><div style="display:grid;grid-template-columns:104px 1fr 22px;align-items:center;gap:6px;margin-bottom:5px"><span style="font-size:9.5px;color:{{ a.lc }};font-weight:{{ a.w }}">{{ a.name }}</span><div style="height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:{{ a.pct }};border-radius:3px;background:linear-gradient(90deg,{{ k.accent }},#ffe19c)"></div></div><span style="font-family:Rajdhani,sans-serif;font-weight:700;font-size:10px;text-align:right;color:{{ a.lc }}">{{ a.v }}</span></div></sc-for>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:500},&quot;player&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;rank&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;}}">
const PHASE_COLOR = { gk:"#F2C14E", def:"#4C9BE8", mid:"#3FB08C", fwd:"#E8654C" };
const PHASE_LABEL = { gk:"Goalkeeper", def:"Defence", mid:"Midfield", fwd:"Attack" };
class Component extends DCLogic {
  state = { expanded:false };
  cardRef = React.createRef();
  renderVals() {
    const p = this.props.player || { name:"Lamine Yamal", team:"Barcelona", pos:"W", arch:"Creator", phase:"fwd", rating:97, league:"La Liga", q:[["0.63","G"],["0.44","AST"],["4.64","SH"]], alts:["Inside Forward","Wide Playmaker"], credit:"Photographer name · CC BY-SA 4.0 · edited" };
    const rank = this.props.rank ?? 2;
    const acc = PHASE_COLOR[p.phase] || "#3FB08C";
    const ex = this.state.expanded;
    const fits = [p.arch, ...(p.alts || [])].map((name, i) => { const v = [91, 74, 58, 41][i] - (p.rating % 5); return { name, v, pct: v + "%", lc: i === 0 ? acc : "#cfcfcf", w: i === 0 ? 700 : 400 }; });
    return {
      p, k: { accent: acc, a: acc + "48", b: acc + "30", line: acc + "66", ini: acc + "77", rankColor: rank <= 3 ? acc : "#3a3a3a" },
      rankLabel: `#${rank}`, phaseLabel: PHASE_LABEL[p.phase], phaseLower: (PHASE_LABEL[p.phase] || "").toLowerCase(),
      initials: p.name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase(),
      quick: p.q.map(([v, l], i) => ({ v, l, c: i === 0 ? acc : "#e5e5e5", sep: i === 0 ? "transparent" : "rgba(255,255,255,.08)" })),
      expanded: ex, fits,
      tabs: ["Fit","Stats","Radar","Career"].map((label, i) => ({ label, color: i === 0 ? acc : "#767676", border: i === 0 ? acc : "transparent" })),
      peekRadius: ex ? "11px 11px 0 0" : "11px", chevDeg: ex ? "180deg" : "0deg",
      cardRef: this.cardRef,
      onToggle: (e) => { e.stopPropagation(); if (this.cardRef.current) this.cardRef.current.style.transform = ""; this.setState(s => ({ expanded: !s.expanded })); },
      onMove: (e) => { const el = this.cardRef.current; if (this.state.expanded || !el) return; const r = el.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; el.style.transform = `rotateX(${(0.5 - y) * 10}deg) rotateY(${(x - 0.5) * 10}deg) scale(1.02)`; },
      onLeave: () => { if (this.cardRef.current) this.cardRef.current.style.transform = ""; },
    };
  }
}
</script>
</body>
</html>
