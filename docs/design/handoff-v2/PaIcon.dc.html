<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0">
<sc-if value="{{ is.game }}"><polygon stroke="{{ c.gold }}" points="12,2 17,3.35 20.65,7 22,12 20.65,17 17,20.65 12,22 7,20.65 3.35,17 2,12 3.35,7 7,3.35"></polygon></sc-if>
<sc-if value="{{ is.nba }}"><circle cx="12" cy="12" r="9" stroke="{{ c.blue }}"></circle><path d="M12 3v18" stroke="{{ c.red }}"></path><path d="M5.5 7.5c2-1 4 2 6.5 2s4.5-3 6.5-2" stroke="{{ c.blue }}"></path><path d="M5.5 16.5c2 1 4-2 6.5-2s4.5 3 6.5 2" stroke="{{ c.red }}"></path></sc-if>
<sc-if value="{{ is.football }}"><g stroke="{{ c.teal }}"><circle cx="12" cy="12" r="9"></circle><polygon points="12,7.6 15.7,10.3 14.3,14.6 9.7,14.6 8.3,10.3"></polygon><path d="M12 3v4.6"></path><path d="M20.6 9.6l-4.9.7"></path><path d="M17.2 19.4l-2.9-4.8"></path><path d="M6.8 19.4l2.9-4.8"></path><path d="M3.4 9.6l4.9.7"></path></g></sc-if>
<sc-if value="{{ is.gleague }}"><g stroke="{{ c.red }}"><path d="M15 9h-3a4 4 0 00-4 4v0a4 4 0 004 4h4v-4h-2"></path><path d="M7 20h10"></path></g></sc-if>
<sc-if value="{{ is.ncaa }}"><g stroke="{{ c.blue }}"><path d="M7 18V6l10 12V6"></path><path d="M5 6h14"></path></g></sc-if>
<sc-if value="{{ is.eur }}"><polygon stroke="{{ c.gold }}" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"></polygon></sc-if>
<sc-if value="{{ is.nba2 }}"><g stroke="{{ c.l1 }}"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18"></path><path d="M5.8 5.8c2.9 3.1 2.9 9.3 0 12.4M18.2 5.8c-2.9 3.1-2.9 9.3 0 12.4"></path></g></sc-if>
<sc-if value="{{ is.gleague2 }}"><g stroke="{{ c.l2 }}"><path d="M3 20h4.5v-4.5H12V11h4.5V6.5H21"></path><path d="M17.5 3.5H21V7"></path></g></sc-if>
<sc-if value="{{ is.ncaa2 }}"><g stroke="{{ c.l3 }}"><path d="M2 9.5L12 5l10 4.5L12 14z"></path><path d="M6 11.3V16c0 1.4 2.7 2.8 6 2.8s6-1.4 6-2.8v-4.7"></path><path d="M22 9.5v5"></path></g></sc-if>
<sc-if value="{{ is.eur2 }}"><g stroke="{{ c.l4 }}"><circle cx="12" cy="12" r="3.2"></circle><circle cx="20" cy="12" r="1"></circle><circle cx="17.66" cy="17.66" r="1"></circle><circle cx="12" cy="20" r="1"></circle><circle cx="6.34" cy="17.66" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="6.34" cy="6.34" r="1"></circle><circle cx="12" cy="4" r="1"></circle><circle cx="17.66" cy="6.34" r="1"></circle></g></sc-if>
<sc-if value="{{ is.trophy }}"><g stroke="{{ c.gray }}" stroke-width="2"><path d="M7 4 h10 v5 a5 5 0 0 1 -10 0 z"></path><path d="M7 5 H4 a2 2 0 0 0 0 4 h1.2"></path><path d="M17 5 h3 a2 2 0 0 1 0 4 h-1.2"></path><path d="M12 14 v3"></path><path d="M8.5 20.5 h7 M9.5 17.5 h5 v3 h-5 z"></path></g></sc-if>
<sc-if value="{{ is.info }}"><g stroke="{{ c.gray }}"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></g></sc-if>
<sc-if value="{{ is.play }}"><path d="M7 4.5 v15 l12 -7.5 z" fill="{{ c.gray }}" stroke="{{ c.gray }}"></path></sc-if>
<sc-if value="{{ is.users }}"><g stroke="{{ c.gray }}" stroke-width="2"><circle cx="8.5" cy="8" r="3"></circle><path d="M3 20 a5.5 5.5 0 0 1 11 0"></path><path d="M15.5 6 a3 3 0 0 1 0 6 M16.5 15.2 a5.5 5.5 0 0 1 4.5 4.8"></path></g></sc-if>
<sc-if value="{{ is.monitor }}"><g stroke="{{ c.gray }}" stroke-width="2"><rect x="3" y="4.5" width="18" height="12" rx="1.5"></rect><path d="M9 20 h6 M12 16.5 v3.5"></path></g></sc-if>
<sc-if value="{{ is.globe }}"><g stroke="{{ c.gray }}" stroke-width="2"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12 h17 M12 3.5 a13 13 0 0 1 0 17 a13 13 0 0 1 0 -17"></path></g></sc-if>
<sc-if value="{{ is.jrefresh }}"><g stroke="{{ c.gray }}" stroke-width="2"><path d="M20 11 a8 8 0 0 0 -14 -4 L3 10"></path><path d="M4 13 a8 8 0 0 0 14 4 l3 -3"></path><path d="M3 5 v5 h5 M21 19 v-5 h-5"></path></g></sc-if>
<sc-if value="{{ is.calendar }}"><g stroke="{{ c.gray }}" stroke-width="2"><rect x="3.5" y="5" width="17" height="16" rx="2"></rect><path d="M3.5 9.5 h17 M8 3 v4 M16 3 v4"></path></g></sc-if>
<sc-if value="{{ is.bolt }}"><path d="M13 2 L4 13.5 h6 L11 22 l9 -11.5 h-6 z" fill="{{ c.gray }}" stroke="{{ c.gray }}" stroke-width="1.2"></path></sc-if>
<sc-if value="{{ is.jsearch }}"><g stroke="{{ c.gray }}" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 L21 21"></path></g></sc-if>
<sc-if value="{{ is.wheel }}"><g stroke="{{ c.gray }}" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 3 v3.5 M12 17.5 V21 M3 12 h3.5 M17.5 12 H21 M5.6 5.6 l2.5 2.5 M15.9 15.9 l2.5 2.5 M18.4 5.6 l-2.5 2.5 M8.1 15.9 l-2.5 2.5"></path></g></sc-if>
<sc-if value="{{ is.cap }}"><g stroke="{{ c.gray }}" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M14.5 9 a3 2.2 0 0 0 -5 0.8 c0 2.6 5 1.4 5 4 a3 2.2 0 0 1 -5 0.8"></path><path d="M12 6.5 v11"></path></g></sc-if>
<sc-if value="{{ is.star }}"><polygon stroke="{{ c.gray }}" points="12,3 14.7,8.6 20.8,9.3 16.3,13.5 17.5,19.6 12,16.6 6.5,19.6 7.7,13.5 3.2,9.3 9.3,8.6"></polygon></sc-if>
<sc-if value="{{ is.lineups }}"><path stroke="{{ c.gray }}" d="M4 7h16M7 12h13M10 17h10"></path></sc-if>
<sc-if value="{{ is.explore }}"><g stroke="{{ c.asagi }}"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></g></sc-if>
<sc-if value="{{ is.blog }}"><path stroke="{{ c.red }}" d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"></path></sc-if>
<sc-if value="{{ is.about }}"><path stroke="{{ c.gray }}" d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></sc-if>
<sc-if value="{{ is.admin }}"><g stroke="{{ c.gray }}"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></g></sc-if>
<sc-if value="{{ is.refresh }}"><g stroke="{{ c.gray }}"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3"></path><path d="M18 4v4h-4M6 20v-4h4"></path></g></sc-if>
<sc-if value="{{ is.search }}"><g stroke="{{ c.gray }}"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.8-3.8"></path></g></sc-if>
<sc-if value="{{ is.sliders }}"><g stroke="{{ c.gray }}"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></g></sc-if>
<sc-if value="{{ is.chevron }}"><path stroke="{{ c.gray }}" d="M6 9l6 6 6-6"></path></sc-if>
<sc-if value="{{ is.collapse }}"><g stroke="{{ c.gray }}"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16M15 10l-2 2 2 2"></path></g></sc-if>
<sc-if value="{{ is.menu }}"><path stroke="{{ c.gray }}" d="M4 7h16M4 12h16M4 17h16"></path></sc-if>
<sc-if value="{{ is.close }}"><path stroke="{{ c.gray }}" d="M6 6l12 12M18 6L6 18"></path></sc-if>
<sc-if value="{{ is.check }}"><path stroke="{{ c.gray }}" d="M5 12l5 5 9-10"></path></sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;game&quot;,&quot;nba&quot;,&quot;football&quot;,&quot;gleague&quot;,&quot;ncaa&quot;,&quot;eur&quot;,&quot;lineups&quot;,&quot;explore&quot;,&quot;blog&quot;,&quot;about&quot;,&quot;admin&quot;,&quot;refresh&quot;,&quot;search&quot;,&quot;sliders&quot;,&quot;chevron&quot;,&quot;collapse&quot;,&quot;menu&quot;,&quot;close&quot;,&quot;check&quot;],&quot;default&quot;:&quot;game&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9ca3af&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const name = this.props.icon || "game";
    const brand = !!this.props.brand;
    const col = this.props.color || "currentColor";
    const pick = (b) => brand ? b : col;
    const c = { gold: pick("#FFB11B"), blue: pick("#1d428a"), red: pick("#c8102e"), teal: pick("#3FB08C"), asagi: pick("#00A3AF"), gray: pick("#9ca3af"), l1: pick("#e8654c"), l2: pick("#A8263F"), l3: pick("#3D7EC9"), l4: pick("#FF6900") };
    const is = {}; is[name] = true;
    return { size: this.props.size || 20, c, is };
  }
}
</script>
</body>
</html>
